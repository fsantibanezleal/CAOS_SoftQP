<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img"><title>Constraint policy and evidence</title><style>:root{color-scheme:light dark} .bg{fill:light-dark(#eef4f8,#142633)} .edge{stroke:light-dark(#456278,#a3bbcb);stroke-width:3;fill:none}.node{fill:light-dark(#d5e8ee,#234859);stroke:#38a5a4;stroke-width:3}.accent{fill:#dd9a43}.pulse{animation:move 5s ease-in-out infinite}@keyframes move{0%,100%{transform:translateX(0)}50%{transform:translateX(24px)}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style><rect class="bg" width="900" height="300" rx="24"/><path class="edge" d="M140 150H760"/><rect class="node" x="70" y="75" width="150" height="150" rx="22"/><path class="edge" d="M105 180l35-85 35 85m-55-30h40"/><rect class="node" x="375" y="75" width="150" height="150" rx="22"/><path class="edge" d="M410 190l25-80 30 80 30-80"/><rect class="node" x="680" y="75" width="150" height="150" rx="22"/><path class="edge" d="M710 150l25 25 60-65"/><circle class="accent pulse" cx="290" cy="150" r="12"/></svg>