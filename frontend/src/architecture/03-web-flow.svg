<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" class="arch-svg" role="img" aria-label="From selection to a verified view">
<style>.arch-svg text{font-family:var(--font-sans);fill:var(--color-fg)}.arch-svg .title{font-size:24px;font-weight:700}.arch-svg .head{font-size:22px;font-weight:700}.arch-svg .line{font-size:20px}.arch-svg .foot{font-size:19px;fill:var(--color-fg-subtle)}</style>
<text x="24" y="36" class="title l-en">From selection to a verified view</text><text x="24" y="36" class="title l-es">De la selección a la vista verificada</text>
<rect x="24" y="64" width="412" height="184" rx="12" fill="var(--color-surface-2)" stroke="var(--color-border)" stroke-width="2"/><rect x="24" y="64" width="7" height="184" rx="3" fill="var(--color-accent)"/>
<text x="44" y="100" class="head l-en">Select a case</text><text x="44" y="100" class="head l-es">Seleccionar caso</text>
<text x="44" y="140" class="line l-en">Inventory lists valid IDs</text><text x="44" y="140" class="line l-es">Índice con IDs válidos</text>
<text x="44" y="176" class="line l-en">URL identifies selection</text><text x="44" y="176" class="line l-es">Selección enlazable</text>
<text x="44" y="212" class="line l-en">Cancel obsolete loads</text><text x="44" y="212" class="line l-es">Cancelar cargas antiguas</text>
<rect x="464" y="64" width="412" height="184" rx="12" fill="var(--color-surface-2)" stroke="var(--color-border)" stroke-width="2"/><rect x="464" y="64" width="7" height="184" rx="3" fill="var(--color-accent)"/>
<text x="484" y="100" class="head l-en">Verify the artifact</text><text x="484" y="100" class="head l-es">Verificar artefacto</text>
<text x="484" y="140" class="line l-en">Load exact raw bytes</text><text x="484" y="140" class="line l-es">Cargar bytes originales</text>
<text x="484" y="176" class="line l-en">Check declared digest</text><text x="484" y="176" class="line l-es">Comprobar hash declarado</text>
<text x="484" y="212" class="line l-en">Validate schema and ID</text><text x="484" y="212" class="line l-es">Validar esquema e ID</text>
<rect x="24" y="276" width="412" height="184" rx="12" fill="var(--color-surface-2)" stroke="var(--color-border)" stroke-width="2"/><rect x="24" y="276" width="7" height="184" rx="3" fill="var(--color-accent)"/>
<text x="44" y="312" class="head l-en">Inspect one unit</text><text x="44" y="312" class="head l-es">Inspeccionar una unidad</text>
<text x="44" y="352" class="line l-en">Filter original row units</text><text x="44" y="352" class="line l-es">Filtrar unidades de filas</text>
<text x="44" y="388" class="line l-en">Separate bound sides</text><text x="44" y="388" class="line l-es">Separar ambos lados</text>
<text x="44" y="424" class="line l-en">Export all original rows</text><text x="44" y="424" class="line l-es">Exportar todas las filas</text>
<rect x="464" y="276" width="412" height="184" rx="12" fill="var(--color-surface-2)" stroke="var(--color-border)" stroke-width="2"/><rect x="464" y="276" width="7" height="184" rx="3" fill="var(--color-accent)"/>
<text x="484" y="312" class="head l-en">Compare formulations</text><text x="484" y="312" class="head l-es">Comparar formulaciones</text>
<text x="484" y="352" class="line l-en">Preserve incompatibility</text><text x="484" y="352" class="line l-es">Conservar incompatibilidad</text>
<text x="484" y="388" class="line l-en">Original objective gap</text><text x="484" y="388" class="line l-es">Brecha de costo original</text>
<text x="484" y="424" class="line l-en">Dimensions, not rankings</text><text x="484" y="424" class="line l-es">Dimensiones, sin ranking</text>
<path d="M440 156h18m-7-7 7 7-7 7M440 368h18m-7-7 7 7-7 7M232 250v22m-7-7 7 7 7-7M672 250v22m-7-7 7 7 7-7" fill="none" stroke="var(--color-fg-faint)" stroke-width="2"/>
<text x="24" y="504" class="foot l-en">A failed check shows a reason; no fabricated successful plot.</text><text x="24" y="504" class="foot l-es">Una verificación fallida informa su razón, sin éxito inventado.</text>
</svg>
