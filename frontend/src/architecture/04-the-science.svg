<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" class="arch-svg" role="img" aria-label="Convex quadratic programs with declared slack">
<style>.arch-svg text{font-family:var(--font-sans);fill:var(--color-fg)}.arch-svg .title{font-size:24px;font-weight:700}.arch-svg .head{font-size:22px;font-weight:700}.arch-svg .line{font-size:20px}.arch-svg .foot{font-size:19px;fill:var(--color-fg-subtle)}</style>
<text x="24" y="36" class="title l-en">Convex quadratic programs with declared slack</text><text x="24" y="36" class="title l-es">Programas cuadráticos con holguras declaradas</text>
<rect x="24" y="64" width="412" height="184" rx="12" fill="var(--color-surface-2)" stroke="var(--color-border)" stroke-width="2"/><rect x="24" y="64" width="7" height="184" rx="3" fill="var(--color-accent)"/>
<text x="44" y="100" class="head l-en">Convex base objective</text><text x="44" y="100" class="head l-es">Objetivo base convexo</text>
<text x="44" y="140" class="line">f(x) = ½ xᵀPx + qᵀx</text>
<text x="44" y="176" class="line l-en">P is symmetric and PSD</text><text x="44" y="176" class="line l-es">P simétrica y semidefinida</text>
<text x="44" y="212" class="line l-en">Hard rows: l ≤ Ax ≤ u</text><text x="44" y="212" class="line l-es">Filas duras: l ≤ Ax ≤ u</text>
<rect x="464" y="64" width="412" height="184" rx="12" fill="var(--color-surface-2)" stroke="var(--color-border)" stroke-width="2"/><rect x="464" y="64" width="7" height="184" rx="3" fill="var(--color-accent)"/>
<text x="484" y="100" class="head l-en">Physical side violations</text><text x="484" y="100" class="head l-es">Incumplimientos físicos</text>
<text x="484" y="140" class="line">vₗ = max(l − Ax, 0)</text>
<text x="484" y="176" class="line">vᵤ = max(Ax − u, 0)</text>
<text x="484" y="212" class="line l-en">Signed slack ξ = vₗ − vᵤ</text><text x="484" y="212" class="line l-es">Holgura ξ = vₗ − vᵤ</text>
<rect x="24" y="276" width="412" height="184" rx="12" fill="var(--color-surface-2)" stroke="var(--color-border)" stroke-width="2"/><rect x="24" y="276" width="7" height="184" rx="3" fill="var(--color-accent)"/>
<text x="44" y="312" class="head l-en">Separable elastic cost</text><text x="44" y="312" class="head l-es">Costo elástico separable</text>
<text x="44" y="352" class="line">aₗvₗ + aᵤvᵤ</text>
<text x="44" y="388" class="line">+ ½ bₗvₗ² + ½ bᵤvᵤ²</text>
<text x="44" y="424" class="line l-en">Nonnegative side weights</text><text x="44" y="424" class="line l-es">Pesos no negativos</text>
<rect x="464" y="276" width="412" height="184" rx="12" fill="var(--color-surface-2)" stroke="var(--color-border)" stroke-width="2"/><rect x="464" y="276" width="7" height="184" rx="3" fill="var(--color-accent)"/>
<text x="484" y="312" class="head l-en">Independent checks</text><text x="484" y="312" class="head l-es">Verificaciones independientes</text>
<text x="484" y="352" class="line l-en">Explicit lifted optimum</text><text x="484" y="352" class="line l-es">Óptimo con holguras</text>
<text x="484" y="388" class="line l-en">Original cost and residuals</text><text x="484" y="388" class="line l-es">Costo y residuos originales</text>
<text x="484" y="424" class="line l-en">Hard-row infeasibility tests</text><text x="484" y="424" class="line l-es">Pruebas de infactibilidad</text>
<path d="M440 156h18m-7-7 7 7-7 7M440 368h18m-7-7 7 7-7 7M232 250v22m-7-7 7 7 7-7M672 250v22m-7-7 7 7 7-7" fill="none" stroke="var(--color-fg-faint)" stroke-width="2"/>
<text x="24" y="504" class="foot l-en">Asymmetry is known; novelty and speed remain research questions.</text><text x="24" y="504" class="foot l-es">La asimetría es conocida; novedad y rapidez siguen en estudio.</text>
</svg>
